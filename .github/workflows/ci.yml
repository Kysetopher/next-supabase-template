name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      # The same build Cloudflare Workers Builds runs (docs/CLOUDFLARE.md), so a
      # change that won't bundle for Workers fails here before it reaches a
      # deploy. Needs no secrets or env vars: GitHub holds none, and deploys
      # stay on Workers Builds. After the smoke tests because it rebuilds .next
      # in standalone mode, which `next start` doesn't serve.
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
